# Calls the reusable workflows defined once in lemonfiber/spec (Q-R56).
name: ci
on: [pull_request]
permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. A reusable workflow's permissions block is a request,
  # and a caller granting less than it asks for fails the whole run before any
  # job starts — every required context silent, and nothing to report against.
  # The workflow-level `contents: read` is the default for a job that declares
  # nothing, and a job-level block replaces that default outright, so
  # `contents: read` is restated here rather than inherited.
  spec-check:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@09410894c122b6395d553143417d9248bc95ade6 # v1.0.25
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@09410894c122b6395d553143417d9248bc95ade6 # v1.0.25
  # Every pin this repository holds on a shared workflow, against what the spec's
  # default branch holds now. It fails naming the commits a pin has not taken; a
  # run that could not ask which they are says so rather than reporting clean.
  workflow-pins:
    uses: lemonfiber/spec/.github/workflows/workflow-pins.yml@09410894c122b6395d553143417d9248bc95ade6 # v1.0.25
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@09410894c122b6395d553143417d9248bc95ade6 # v1.0.25
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@09410894c122b6395d553143417d9248bc95ade6 # v1.0.25
  attribution:
    uses: lemonfiber/spec/.github/workflows/attribution.yml@09410894c122b6395d553143417d9248bc95ade6 # v1.0.25
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@09410894c122b6395d553143417d9248bc95ade6 # v1.0.25
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@09410894c122b6395d553143417d9248bc95ade6 # v1.0.25
