# Move a first-party plugin's pin in the default bundle to what its release published.
#
# A first-party plugin's repository dispatches this once the pull request pinning its
# adapter's image in its manifest has merged, with the merge commit (OPS-R86).
# `bundle.py --apply` moves the pin to that revision, taking the release from the
# adapter service's tag and the digest from the manifest, and copies the manifest in;
# this puts the change on one rolling branch, signed, and opens or updates its pull
# request. Its checks are the ones every change to the bundle meets (REPO-R92).
name: bundle-bump

on:
  workflow_dispatch:
    inputs:
      id:
        description: "The plugin's id, as the bundle pins it, e.g. jellyfin."
        required: true
      revision:
        description: "The commit its pin pull request merged, 40 hex."
        required: true

permissions:
  contents: read

concurrency:
  # One move at a time: every move rewrites the one rolling branch.
  group: bundle-bump
  cancel-in-progress: false

env:
  BRANCH: release/bundle-pins

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # `main` requires signed commits and only commits GitHub makes are signed,
      # and a pull request opened with `GITHUB_TOKEN` triggers no workflows. Both
      # want an app token.
      - name: Mint a token that can open a pull request here
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The rolling pull request is the one on this repository's own branch that
      # the release App opened. A pull request from a fork can carry a branch of
      # the same name, so it is looked up by owner and its head and author held.
      - name: Find the rolling pull request
        id: rolling
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BOT: ${{ steps.token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/pulls?head=${OWNER}:${BRANCH}&state=open" \
            --jq "map(select(.head.repo.full_name == \"${REPO}\" and .user.login == \"${BOT}\"))
                  | .[0] // {} | \"number=\(.number // \"\")\nhead=\(.head.sha // \"\")\"" \
            >> "$GITHUB_OUTPUT"

      - name: Move the pin
        id: move
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          PLUGIN: ${{ inputs.id }}
          REVISION: ${{ inputs.revision }}
          OPEN_HEAD: ${{ steps.rolling.outputs.head }}
        run: |
          set -euo pipefail
          # Held to their shapes before they reach a command line; `bundle.py`
          # holds them again, with the reason in words.
          [[ "$PLUGIN" =~ ^[a-z][a-z0-9]*(-[a-z0-9]+)*$ ]] \
            || { echo "::error::'${PLUGIN}' is not a plugin id"; exit 1; }
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::'${REVISION}' is not a full commit"; exit 1; }
          python3 registry/bundle.py --self-test

          # The moves the open rolling pull request already carries are kept.
          carry=()
          if [ -n "$OPEN_HEAD" ]; then
            [[ "$OPEN_HEAD" =~ ^[0-9a-f]{40}$ ]] \
              || { echo "::error::the rolling pull request's head '${OPEN_HEAD}' is not a commit"; exit 1; }
            gh api "repos/${REPO}/contents/bundle/bundle.toml?ref=${OPEN_HEAD}" --jq .content \
              | base64 -d > "$RUNNER_TEMP/carried.toml"
            carry=(--carry "$RUNNER_TEMP/carried.toml")
          fi
          # Outside the checkout, so the commit below cannot carry it.
          python3 registry/bundle.py --apply "$PLUGIN" "$REVISION" "${carry[@]}" > "$RUNNER_TEMP/applied.json"
          cat "$RUNNER_TEMP/applied.json"
          git add bundle
          if git diff --cached --quiet; then
            echo "moved=no" >> "$GITHUB_OUTPUT"
            echo "::notice::the bundle already pins ${PLUGIN} at ${REVISION}."
            exit 0
          fi
          echo "moved=yes" >> "$GITHUB_OUTPUT"

      # The same gate the pull request will meet.
      - name: Every copy is its origin's manifest at the pinned revision
        if: steps.move.outputs.moved == 'yes'
        run: python3 registry/bundle.py

      - name: Put the change on the branch, signed, and open or update its pull request
        if: steps.move.outputs.moved == 'yes'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          EXISTING: ${{ steps.rolling.outputs.number }}
        run: |
          set -euo pipefail
          staging="${BRANCH}-staging"
          # The commit the files were read from: the change carries whole files,
          # and laid onto a later `main` they would undo what landed between.
          base="$(git rev-parse HEAD)"

          # Built on a scratch ref and moved across in one step, so the pull
          # request's branch never holds no commits, which would close it.
          if gh api "repos/${REPO}/git/ref/heads/${staging}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPO}/git/refs/heads/${staging}" \
              -F sha="${base}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref="refs/heads/${staging}" -f sha="${base}" >/dev/null
          fi

          python3 - "$REPO" "$staging" "$base" "$RUNNER_TEMP" <<'PY' > "$RUNNER_TEMP/request.json"
          import base64
          import json
          import subprocess
          import sys

          repo, branch, base, scratch = sys.argv[1:5]
          moves = json.load(open(f"{scratch}/applied.json"))["moves"]
          headline = "chore(bundle): pin " + ", ".join(f"{move['id']} {move['to']['release']}" for move in moves)
          said = [
              f"- {move['id']}: {move['from']['release']} -> {move['to']['release']}, at "
              f"{move['to']['revision']}, manifest {move['to']['manifest']}"
              for move in moves
          ]
          body = "\n".join([
              "The release train moves each first-party plugin's pin and copy in the default "
              "bundle to the revision its pin pull request merged (OPS-R86).",
              "",
              *said,
              "",
              "Spec: OPS-R86, REPO-R91",
              "Signed-off-by: lemonfiber release <release@lemonfiber.app>",
          ])
          changed = subprocess.run(
              ["git", "diff", "--cached", "--name-only"], capture_output=True, text=True, check=True
          ).stdout.split()
          print(json.dumps({
              "query": (
                  "mutation($input: CreateCommitOnBranchInput!) "
                  "{ createCommitOnBranch(input: $input) { commit { oid } } }"
              ),
              "variables": {"input": {
                  "branch": {"repositoryNameWithOwner": repo, "branchName": branch},
                  "expectedHeadOid": base,
                  "message": {"headline": headline, "body": body},
                  "fileChanges": {"additions": [
                      {"path": name, "contents": base64.b64encode(open(name, "rb").read()).decode()}
                      for name in changed
                  ]},
              }},
          }))
          with open(f"{scratch}/headline.txt", "w") as handle:
              handle.write(headline)
          with open(f"{scratch}/body.md", "w") as handle:
              handle.write(body + "\n")
          PY

          built="$(gh api graphql --input "$RUNNER_TEMP/request.json" --jq '.data.createCommitOnBranch.commit.oid')"
          [[ "$built" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::the commit was not created; got '${built}'"; exit 1; }

          if gh api "repos/${REPO}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPO}/git/refs/heads/${BRANCH}" \
              -F sha="${built}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref="refs/heads/${BRANCH}" -f sha="${built}" >/dev/null
          fi
          gh api --method DELETE "repos/${REPO}/git/refs/heads/${staging}" >/dev/null 2>&1 || true

          headline="$(cat "$RUNNER_TEMP/headline.txt")"
          existing="$EXISTING"
          if [ -z "$existing" ]; then
            created="$(gh pr create --repo "${REPO}" --head "${BRANCH}" --base main \
              --title "${headline}" --body-file "$RUNNER_TEMP/body.md" --label dependencies)"
            existing="${created##*/}"
            echo "::notice::opened #${existing}"
          fi
          [[ "$existing" =~ ^[0-9]+$ ]] || { echo "::error::'${existing}' is not a pull request number"; exit 1; }

          # Nothing is edited or armed on a pull request whose head is not the
          # commit made above. The head follows the branch moments after it moves.
          head=""
          for _ in 1 2 3 4 5 6; do
            head="$(gh api "repos/${REPO}/pulls/${existing}" --jq .head.sha)"
            [ "$head" = "$built" ] && break
            sleep 5
          done
          if [ "$head" != "$built" ]; then
            echo "::error::#${existing}'s head is ${head}, not ${built}, so it is neither edited nor armed"
            exit 1
          fi

          if [ -n "$EXISTING" ]; then
            gh pr edit "${existing}" --repo "${REPO}" --title "${headline}" --body-file "$RUNNER_TEMP/body.md" >/dev/null
            echo "::notice::#${existing} updated"
          fi
          gh pr merge "${existing}" --repo "${REPO}" --auto --squash --match-head-commit "${built}" \
            && echo "auto-merge armed on #${existing}" \
            || echo "::warning::could not arm auto-merge on #${existing}; it waits for a maintainer."
