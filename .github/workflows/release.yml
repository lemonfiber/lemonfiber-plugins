# A catalogue release: the register, as an index, signed, on a tag.
#
# What is reviewed here is the register, so what a release signs is an index of it —
# each plugin's origin, the revision somebody read and the digest of its manifest there —
# and nothing else (`REPO-R57`, ADR-0034). lemonfiber installs a plugin by name only
# through an index whose signature verifies against the public key it carries.
#
# The catalogue tags on its own clock (`OPS-R59`): a maintainer pushes a `v*` tag on a
# commit of `main`, and this publishes the release. It refuses rather than publish an
# index that is unsigned, or one signed while any registration fails its checks.
#
# The key is a cosign P-256 key pair. Its private half is the `CATALOGUE_SIGNING_KEY`
# secret and its password `CATALOGUE_SIGNING_PASSWORD`; this job is the only reader of
# either. The signature published is the plain ECDSA signature over the index's bytes,
# taken out of the bundle cosign writes, and it is verified against the public half
# before anything is published — the check lemonfiber makes on an operator's machine.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read

# One release per tag, never cancelled: a release half-published is worse than one
# that waited.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # A tag on a commit nobody merged would sign a register nobody reviewed.
      - name: The tagged commit is on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::${GITHUB_SHA} is not on main; a release signs what was merged."; exit 1; }
      - name: Every registration holds, as the release this catalogue targets reads it
        run: python3 registry/check.py
      - name: The index is what was reviewed
        run: |
          set -euo pipefail
          python3 registry/index.py --self-test
          python3 registry/index.py
      # lemonfiber refuses an index older than one it has verified, so a serial that is
      # not above the last release's would be a release nobody who installed from the
      # last one could use, and one a replaced release could stand in for.
      - name: The serial is above every earlier release's
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now=$(jq -e '.serial | numbers' index.json)
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -z "$latest" ]; then
            echo "the first release, as serial ${now}"
            exit 0
          fi
          gh release download "$latest" --repo "$GITHUB_REPOSITORY" --pattern index.json \
            --output "$RUNNER_TEMP/previous.json"
          was=$(jq -e '.serial | numbers' "$RUNNER_TEMP/previous.json") \
            || { echo "::error::${latest} names no serial, so nothing can say this one is newer."; exit 1; }
          if [ "$now" -le "$was" ]; then
            echo "::error::serial ${now} is not above ${was}, which ${latest} carries."
            exit 1
          fi
          echo "serial ${now}, above ${was} from ${latest}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign the index, and verify what was signed
        env:
          CATALOGUE_SIGNING_KEY: ${{ secrets.CATALOGUE_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.CATALOGUE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CATALOGUE_SIGNING_KEY}" ]; then
            echo "::error::CATALOGUE_SIGNING_KEY is not set, and an index is never published unsigned."
            exit 1
          fi
          cosign sign-blob --yes --key env://CATALOGUE_SIGNING_KEY --use-signing-config=false \
            --bundle "$RUNNER_TEMP/index.json.bundle" index.json
          jq -r '.messageSignature.signature' "$RUNNER_TEMP/index.json.bundle" > index.json.sig
          cosign public-key --key env://CATALOGUE_SIGNING_KEY > "$RUNNER_TEMP/catalogue.pub"
          base64 -d index.json.sig > "$RUNNER_TEMP/index.json.der"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/catalogue.pub" \
            -signature "$RUNNER_TEMP/index.json.der" index.json
      - name: Publish the index and its signature on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" index.json index.json.sig --verify-tag --title "$TAG" \
            --notes "The catalogue's register at ${GITHUB_SHA}, as index.json, and a signature over exactly its bytes as index.json.sig."
