# What this catalogue says about every registration, before a person reads one.
#
# `REPO-R61` is this file: fetch each registered revision and, out of the
# data in that revision alone, validate the manifest against the schema lemonfiber
# publishes, run every declared proof against that plugin's own recordings, and check
# its declared reach statically. A registration failing any of it is refused here
# rather than in review, which is what `F5-R13` asks the catalogue's CI to be. The
# bundle's pinned revisions are held to the same, and each copy to its origin (`REPO-R92`).
#
# Nothing from a registered repository runs (`REPO-R62`). The programs are this
# repository's own copies and the registered revision supplies data — see the comment
# on `assembled()` in `registry/check.py`, which is where the direction is enforced.
name: registry
on: [pull_request]
permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The pointers, before anything is fetched. An entry that does not say what an entry
  # may say is a defect in the registration rather than in the plugin, and a reviewer
  # should be told which of the two they are looking at.
  entries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The rules refuse what they exist to refuse
        run: python3 registry/entry.py --self-test
      - name: Every entry says what an entry may say
        run: python3 registry/entry.py

  # The harness here is the template's harness, byte for byte. A catalogue holding its
  # own fork of the validator would be a second opinion about what a manifest means,
  # and the plugin repositories would go green against a rule this one had dropped.
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The harness here is the template's harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone lemonfiber/plugin-template "$RUNNER_TEMP/template" -- --depth 1
          diff -ru "$RUNNER_TEMP/template/.github/reader" .github/reader

  # The template every author starts from, against the commands this catalogue runs.
  # The job above holds the two copies of the harness to each other; this holds the
  # template to what they decide, which is the half a byte-diff cannot answer.
  #
  # It is here because nowhere else asks it. The byte-diff fires on a change to the
  # harness and the template's own CI fires on a commit there, and neither fires when
  # this repository moves to a release that reads the template differently.
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The template validates and proves unmodified
        run: python3 registry/check.py --template

  # The registrations themselves.
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Every registration, as the release this catalogue targets reads it
        run: python3 registry/check.py

  # The default bundle: each copy against its origin at the pinned revision, and that
  # revision held to what a registration is held to (REPO-R92).
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The rules refuse what they exist to refuse
        run: python3 registry/bundle.py --self-test
      - name: Every copy is its origin's manifest at the pinned revision
        run: python3 registry/bundle.py
