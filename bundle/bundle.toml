name        = "Tuning"
description = "Quality profiles and extraction"

[[profile]]
id          = "dash"
name        = "Dashboard"
description = "A page linking everything"

[[profile]]
id          = "proxy"
name        = "Proxy"
description = "Friendly hostnames"

# The forms: named slices of the stack, each the whole closure of profiles it starts.

[[form]]
id          = "search"
name        = "Search"
description = "Find things. Nothing else runs."
profiles    = ["search"]

[[form]]
id          = "dl"
name        = "Download"
description = "You have a link — fetch it."
profiles    = ["usenet", "torrent"]

[[form]]
id          = "hunt"
name        = "Hunt"
description = "Search and grab, manually."
profiles    = ["search", "usenet", "torrent"]

[[form]]
id          = "tv"
name        = "TV"
description = "Search, download and automate television"
profiles    = ["search", "usenet", "torrent", "tv", "subs"]

[[form]]
id          = "movies"
name        = "Movies"
description = "Search, download and automate film"
profiles    = ["search", "usenet", "torrent", "movies", "subs"]

[[form]]
id          = "music"
name        = "Music"
description = "Search, download and automate music"
profiles    = ["search", "usenet", "torrent", "music"]

[[form]]
id          = "books"
name        = "Books"
description = "Search, download and automate books and audiobooks"
profiles    = ["search", "usenet", "torrent", "books"]

[[form]]
id          = "auto"
name        = "Auto"
description = "Everything automated, nothing served"
profiles    = ["search", "usenet", "torrent", "tv", "movies", "music", "books", "subs", "tuning"]

[[form]]
id          = "library"
name        = "Library"
description = "Serve what exists. Requires no third-party accounts."
profiles    = ["media"]

[[form]]
id          = "full"
name        = "Full"
description = "The lot."
profiles    = ["search", "usenet", "torrent", "tv", "movies", "music", "books", "subs", "media", "tuning", "dash"]

[[form]]
id          = "proxy"
name        = "Proxy"
description = "Friendly hostnames. Layers onto any other form."
profiles    = ["proxy"]

# The stack's choices of filler and its links by name, each with why. Every other
# ask is the asking plugin's own [[ask]].

[[wiring]]
by        = "bindery"
asks      = "indexer.search"
filled_by = "prowlarr"
why       = "Two services here answer as an indexer and this asks for one of them. Prowlarr is the stack's choice because it is the one the book *arr can pull a keyed feed from; NZBHydra2 searches Usenet only. Change it and everything that asked follows."

[[wiring]]
by        = "unpackerr"
to        = "sonarr"
why       = "The image is configured per application — UN_SONARR_0_URL and its key — and what it knows is Sonarr, not whatever curates a library. The link is spelled in the service's own terms, so it is about that service."

[[wiring]]
by        = "unpackerr"
to        = "radarr"
why       = "The same, in Radarr's terms."

[[wiring]]
by        = "unpackerr"
to        = "lidarr"
why       = "The same, in Lidarr's terms."

[[wiring]]
by        = "door"
to        = "jellyfin"
why       = "It asks Jellyfin's own question, an item fetched with the session a request presents, and passes what it lets through to Jellyfin's own routes, which it names path by path. What it guards is Jellyfin, not whatever serves media."

# The services the catalogue no longer carries, why each went, and what took its
