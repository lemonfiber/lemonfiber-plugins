# The default bundle: the stack lemonfiber ships and every first-party plugin it is
# built from, pinned (REPO-R91, ADR-0045). The core embeds this repository as a
# submodule and compiles this file and every copy beside it in, so a stack installs
# offline. Contract:
# https://github.com/lemonfiber/spec/blob/main/20-architecture/contracts/bundle.md
#
# [[profile]], [[form]], [[wiring]] and [[removed]] are about the whole stack, and
# no plugin manifest says them (ARCH-R265, ARCH-R268).
#
# One [[plugin]] table per first-party plugin, last in the file, ordered by id:
#
#   id            the plugin's `[plugin].id`, and the id of the service that takes
#                 the part's place.
#   origin        the plugin's repository, as an https URL.
#   release       the tag the release train cut there, without the `v`, named only
#                 where the revision was tagged. Every image the plugin builds is
#                 tagged at it.
#   revision      the full 40-hex commit whose tree is pinned, on the origin's
#                 default branch.
#   manifest      the sha256 digest of plugin.toml at that revision, written
#                 `sha256:<64 hex>`.
#   tree          the sha256 digest of the plugin's tree at that revision
#                 (ARCH-R267). bundle/plugins/<id>/ holds that tree, each file at
#                 its path in the plugin's repository.
#   fills         the capabilities the plugin fills by default.
#   stage         `assembled`, a stack service lemonfiber builds into the stack it
#                 ships, or `installed` through the plugin path.
#   profile       the profile every service of the plugin sits in.
#   last_release  the upstream's latest release, YYYY-MM-DD.
#
# The train moves `release`, `revision`, `manifest`, `tree` and the copy of a plugin
# that builds an image (OPS-R86). A plugin that builds none, and every other field,
# moves by a person's pull request. registry/bundle.py holds every copy to its origin
# at the pinned revision (REPO-R92).

schema = 2

# The profiles: one per role a service plays, each the Compose profile its services
# are written into.

