# The forms: named slices of the stack, each the whole closure of profiles it starts.

[[form]]
id          = "search"
name        = "Search"
description = "Find things. Nothing else runs."
profiles    = ["search"]

[[form]]
id          = "dl"
name        = "Download"
description = "You have a link — fetch it."
profiles    = ["usenet", "torrent"]

[[form]]
