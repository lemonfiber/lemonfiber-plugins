description = "Search, download and automate television"
profiles    = ["search", "usenet", "torrent", "tv", "subs"]

[[form]]
id          = "movies"
name        = "Movies"
description = "Search, download and automate film"
profiles    = ["search", "usenet", "torrent", "movies", "subs"]

[[form]]
id          = "music"
name        = "Music"
description = "Search, download and automate music"
profiles    = ["search", "usenet", "torrent", "music"]

[[form]]
