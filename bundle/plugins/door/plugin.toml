schema_version = 1

[plugin]
id          = "door"
name        = "Door"
version     = "0.18.0"
description = "Lets the household reach the media server, and lets an item's stream or picture out only to someone allowed to see it"
without_it  = "The media server answers on this machine only, and nothing else in the house can play from it"
upstream    = "https://github.com/lemonfiber/lemonfiber-door"
license     = "Hippocratic-3.0"
forms       = ["library", "full"]

[[service]]
id          = "door"
name        = "Door"
image       = "ghcr.io/lemonfiber/door"
digest      = "sha256:e8fa70c407ba25320f0a8606681837b6bdc1cecad7c4b649639de32afebb2def"
tag         = "main-5b65b742fdf9"
port        = 8096
bind        = "lan"
health      = { kind = "tcp", timeout_s = 30 }
criticality = "important"
memory_mib  = 50
reaches     = ""
asks_for    = "Nothing beyond this machine. It asks the media server, beside it, whether the session a request presents may see the item it asks for, asks lemonfiber's pass service, beside it, whether the pass a live stream's request carries is good for that live stream, and fetches no certificate: it serves the one lemonfiber writes into its configuration, which it only reads."
config_path = "/config"
config_ro   = true
posture     = "confined"
user_mode   = "uid"
replaces    = "door"
provides    = ["stream.guard"]
listens     = 8096
contract    = 8081
speaks      = ["stream.guard@1"]

[[service.publish]]
port = 8920

[[service.mount]]
from = "state"
to   = "/state"

[[proof]]
id      = "door.refuses-an-id-in-braces"
title   = "A stream asked for with an id in braces is refused at the door"
fixture = "recordings/door/stream-id-in-braces.json"
why     = """
Jellyfin reads an id in braces as the same item, and the door cannot ask
Jellyfin whether a session may see an id written that way, so the door refuses
it itself without asking anything behind it. The refusal is the pass.
"""
request = { method = "GET", path = "/Videos/%7Bdeadbeef-0000-0000-0000-000000000000%7D/stream?static=true" }
expect  = { status = 403 }

[[proof]]
id      = "door.refuses-a-live-stream-without-a-pass"
title   = "A live stream's file asked for without a pass is refused at the door"
fixture = "recordings/door/live-stream-without-a-pass.json"
why     = """
Jellyfin serves a live stream's file without asking who is there, and no question
about an item covers it. The door passes one on only where the pass service
confirms the pass it carries, and refuses it where the pass service says anything
else or does not answer. Asked of a door with no pass service beside it, a live
stream's file presenting no pass is refused. The refusal is the pass.
"""
request = { method = "GET", path = "/LiveTv/LiveStreamFiles/deadbeef000000000000000000000000/stream.ts" }
expect  = { status = 403 }

[[proof]]
id      = "door.version"
title   = "The image's own program says which release it is"
run     = { args = ["version"] }
expect  = { exit = 0, stdout_starts_with = "lemonfiber-door " }
fixture = "recordings/door/version.json"
why     = """
Every other proof here is a status the door chose, which a port proxy or another
server could give as well. Run as the image's own program, the door names the
release it was built as, which says the image is lemonfiber-door's.
"""

[[ask]]
capability = "media.serve"

[[ask]]
capability = "proxy.front"
