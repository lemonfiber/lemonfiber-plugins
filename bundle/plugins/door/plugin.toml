schema_version = 1

[plugin]
id          = "door"
name        = "Door"
version     = "0.18.0"
description = "Lets the household reach Jellyfin, and lets an item's stream or picture out only to someone allowed to see it"
without_it  = "Jellyfin answers on this machine only, and nothing else in the house can play from it"
upstream    = "https://github.com/caddyserver/caddy"
license     = "Apache-2.0"
forms       = ["library", "full"]

[[service]]
id          = "door"
name        = "Door"
image       = "ghcr.io/lemonfiber/door"
digest      = "sha256:bb78c5b83612d5ad038be38da1ceb05c541c2502cdd95720ebbb1db3e1be0a55"
tag         = "main-0c3ae0d8a425"
port        = 8096
bind        = "lan"
health      = { kind = "tcp", timeout_s = 30 }
criticality = "important"
memory_mib  = 50
reaches     = ""
asks_for    = "Nothing beyond this machine. It asks Jellyfin, beside it, whether the session a request presents may see the item it asks for, asks lemonfiber's pass service, beside it, whether the pass a live stream's request carries is good for that live stream, and fetches no certificate: it serves the one lemonfiber writes beside its configuration."
config_path = "/etc/caddy"
config_ro   = true
tmpfs       = ["/data", "/config"]
user_mode   = "uid"
replaces    = "door"
provides    = ["stream.guard"]

[[service.publish]]
port = 8920

[[proof]]
id      = "door.refuses-an-id-in-braces"
title   = "A stream asked for with an id in braces is refused at the door"
fixture = "recordings/door/stream-id-in-braces.json"
why     = """
Jellyfin reads an id in braces as the same item, and the door cannot ask
Jellyfin whether a session may see an id written that way, so the door refuses
it itself without asking anything behind it. The refusal is the pass.
"""
request = { method = "GET", path = "/Videos/%7Bdeadbeef-0000-0000-0000-000000000000%7D/stream?static=true" }
expect  = { status = 403 }

[[proof]]
id      = "door.refuses-a-live-stream-without-a-pass"
title   = "A live stream's file asked for without a pass is refused at the door"
fixture = "recordings/door/live-stream-without-a-pass.json"
why     = """
Jellyfin serves a live stream's file without asking who is there, and no question
about an item covers it. The door passes one on only where the pass service
confirms the pass it carries, and refuses it where the pass service says anything
else or does not answer. Asked of a door with no pass service beside it, a live
stream's file presenting no pass is refused. The refusal is the pass.
"""
request = { method = "GET", path = "/LiveTv/LiveStreamFiles/deadbeef000000000000000000000000/stream.ts" }
expect  = { status = 403 }

[[proof]]
id      = "door.version"
title   = "The image's own Caddy says which release it is"
run     = { args = ["caddy", "version"] }
expect  = { exit = 0, stdout_starts_with = "v2.11.6 " }
fixture = "recordings/door/version.json"
why     = """
Every other proof here is a status the configuration chose, which a port proxy
or another server could give as well. Run as the image's own command, Caddy
names the release it was built from, which says the image is the Caddy this
part is built on, at the release its Dockerfile pins.
"""

[[ask]]
capability = "media.serve"

[[ask]]
capability = "proxy.front"

[[claim]]
capability = "stream.guard"

[[claim.probe]]
id      = "refuses"
request = { method = "GET", path = "/Videos/%7Bdeadbeef-0000-0000-0000-000000000000%7D/stream?static=true" }
expect  = { status = 403 }
fixture = "recordings/door/stream-guard-refuses.json"
