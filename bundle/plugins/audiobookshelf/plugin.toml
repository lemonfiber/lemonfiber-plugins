schema_version = 1

[plugin]
id          = "audiobookshelf"
name        = "Audiobookshelf"
version     = "1.0.0"
description = "Listening to audiobooks, with progress synced"
without_it  = "No audiobook player"
upstream    = "https://github.com/advplyr/audiobookshelf"
license     = "GPL-3.0-only"
forms       = ["library", "full"]

[[service]]
id          = "audiobookshelf"
name        = "Audiobookshelf"
image       = "ghcr.io/advplyr/audiobookshelf"
digest      = "sha256:581d68b2a6fc7ebf58d81c878a9f387cbbc0d88ac9d37b298b9cee10168af85b"
tag         = "2.37.1"
port        = 13378
bind        = "lan"
listens     = 80
health      = { kind = "http", path = "/healthcheck", timeout_s = 90 }
criticality = "enhancing"
memory_mib  = 200
reaches     = "audiobook metadata providers"
asks_for    = "Reads covers, chapters and descriptions for the audiobooks in your library when you ask it to."
takes_data  = true
native      = "audiobookshelf"
replaces    = "audiobookshelf"

[[service.mount]]
from = "metadata"
to   = "/metadata"

[[service]]
id          = "audiobookshelf-adapter"
name        = "Audiobookshelf adapter"
image       = "ghcr.io/lemonfiber/audiobookshelf-adapter"
digest      = "sha256:bd0c8b5b7ca83bb03069fcd3f93fb192fec35b047b8da7718a3ce67d778d9b27"
tag         = "main-b4f87e0bb98d"
criticality = "enhancing"
reaches     = ""
asks_for    = "Nothing beyond this machine. It answers lemonfiber's owner.claim and media.serve contracts by calling Audiobookshelf, beside it, as the root account lemonfiber minted for it."
config_path = "/config"
listens     = 8080
speaks      = ["owner.claim@1", "media.serve@1"]
fronts      = "audiobookshelf"
provides    = ["media.serve"]
media_types = ["audiobooks", "podcasts"]
upstream    = { username = { secret = "root-username" }, password = { secret = "root-password" } }

[[secret]]
id     = "root-username"
of     = "audiobookshelf"
minted = true
why    = "The name of the root account Audiobookshelf is claimed for, which the adapter in front of it signs in as"

[[secret]]
id     = "root-password"
of     = "audiobookshelf"
minted = true
why    = "The password of the root account Audiobookshelf is claimed for, which the adapter in front of it signs in with"

[[proof]]
id      = "audiobookshelf.says-whether-it-is-claimed"
service = "audiobookshelf"
title   = "Audiobookshelf says to anybody whether its first run has made a root"
fixture = "recordings/audiobookshelf/status-claimable.json"
why     = """
The adapter reads whether Audiobookshelf is claimed from this answer before it
can sign in, so the pinned image has to answer it to a caller presenting nothing.
"""
request = { method = "GET", path = "/status" }
expect  = { status = 200, json = { app = "audiobookshelf" }, json_types = { isInit = "bool" } }

[[proof]]
id      = "audiobookshelf.guarded"
service = "audiobookshelf"
title   = "Audiobookshelf shows its libraries to nobody presenting nothing"
fixture = "recordings/audiobookshelf/libraries-guarded.json"
why     = """
A library server on the household network that answered this would be
publishing the household's collection to every device that can reach it. Only
the adapter asks it, signed in as the root lemonfiber minted.
"""
request = { method = "GET", path = "/api/libraries" }
expect  = { status = 401 }

[[ask]]
service    = "audiobookshelf"
capability = "proxy.front"

[[ask]]
service    = "audiobookshelf"
capability = "dashboard.show"

[[wiring]]
service  = "audiobookshelf"
hostname = "listen"
