#:schema https://raw.githubusercontent.com/lemonfiber/lemonfiber/13659f53d634c9d3ae05141706a9a910a1b3b614/contract/plugin-manifest.schema.json
schema_version = 1

[plugin]
id          = "medusa"
name        = "Medusa"
version     = "0.1.0"
description = "Watches for new episodes and fetches them"
without_it  = "Find and download episodes yourself"
upstream    = "https://github.com/pymedusa/Medusa"
license     = "GPL-3.0-only"
forms       = ["tv", "auto", "full"]

[[service]]
id          = "medusa"
name        = "Medusa"
image       = "lscr.io/linuxserver/medusa"
digest      = "sha256:aad89df58a047bab3521a695f0508f2e89fc9ba1f1196866dc8e9a810fc3ae5d"
tag         = "v1.0.27-ls297"
port        = 8086
bind        = "loopback"
listens     = 8081
health      = { kind = "http", path = "/login/", timeout_s = 90 }
criticality = "core"
memory_mib  = 300
reaches     = "television metadata providers"
asks_for    = "Reads series, season and episode information, artwork and air dates for what is in your library and what you add to it."
takes_data  = true
user_mode   = "puid-env"
media_types = ["tv"]
native      = "medusa"

[[service]]
id          = "medusa-adapter"
name        = "Medusa adapter"
image       = "ghcr.io/lemonfiber/medusa-adapter"
digest      = "sha256:860af39d5f6e8fbe2c4c05f7a4a92cce159ac8a94e772a191fde1d661edf52d3"
tag         = "main-53728a71617e"
criticality = "core"
reaches     = "TheTVDB's API at api4.thetvdb.com, only while the operator switches medusa:thetvdb-lookup on"
asks_for    = "It answers lemonfiber's indexer.pull and library.curate contracts by calling Medusa, beside it, with the key and the account lemonfiber minted for it, and asks nothing beyond this machine unless the operator switches medusa:thetvdb-lookup on. Switched on, it signs in to TheTVDB with the operator's own key, and PIN where the key needs one, and asks it for the name, year and seasons of a series Medusa does not hold, so a household can request that series. Switched off, as it is until the operator turns it on, a series Medusa does not hold cannot be requested."
config_path = "/config"
listens     = 8080
media_types = ["tv"]
speaks      = ["indexer.pull@1", "library.curate@1"]
fronts      = "medusa"
provides    = ["library.curate"]
upstream    = { api_key = { secret = "upstream-key" }, username = { secret = "web-username" }, password = { secret = "web-password" } }

[service.env]
IMPORT_STUCK_AFTER_MINUTES = { setting = "medusa:import-stuck-after", default = "60" }
THETVDB_LOOKUP             = { setting = "medusa:thetvdb-lookup", default = "off", one_of = ["off", "on", "on-with-pin"] }
THETVDB_KEY                = { secret = "thetvdb-key" }
THETVDB_PIN                = { secret = "thetvdb-pin" }

[[secret]]
id     = "upstream-key"
of     = "medusa"
minted = true
why    = "The key Medusa answers its API to, which the adapter in front of it presents"
carried_from = { file = "/config/config.ini", format = "ini", key = "General.api_key" }

[[secret]]
id     = "web-username"
of     = "medusa"
minted = true
why    = "The name Medusa's own pages answer to, which the adapter signs in as to have Medusa test its download clients"
carried_from = { file = "/config/config.ini", format = "ini", key = "General.web_username" }

[[secret]]
id     = "web-password"
of     = "medusa"
minted = "password"
why    = "The password Medusa's own pages answer to, which the adapter signs in with to have Medusa test its download clients"
carried_from = { file = "/config/config.ini", format = "ini", key = "General.web_password" }

[[secret]]
id    = "thetvdb-key"
of    = "medusa-adapter"
why   = "Your own TheTVDB API key, which the adapter signs in to TheTVDB with to name a series Medusa does not hold"
needs = { "medusa:thetvdb-lookup" = ["on", "on-with-pin"] }

[[secret]]
id    = "thetvdb-pin"
of    = "medusa-adapter"
why   = "Your TheTVDB subscriber PIN, which TheTVDB asks for beside a user-supported key"
needs = { "medusa:thetvdb-lookup" = ["on-with-pin"] }

[[proof]]
id      = "medusa.answers"
service = "medusa"
title   = "Medusa shows its sign-in page to anybody"
fixture = "recordings/medusa/login-answers.json"
why     = """
The adapter's readiness is this answer, which it asks without a key, so the
pinned image has to give it to a caller presenting nothing.
"""
request = { method = "GET", path = "/login/" }
expect  = { status = 200, body_starts_with = "\n<!DOCTYPE html>" }

[[proof]]
id      = "medusa.guarded"
service = "medusa"
title   = "Medusa shows its settings to nobody presenting nothing"
fixture = "recordings/medusa/settings-guarded.json"
why     = """
Medusa's settings hold the keys and passwords of every download client and
indexer it was given. Only the adapter asks, with the key lemonfiber minted, so
a Medusa that answered them to a caller presenting nothing would be telling
every device that can reach it.
"""
request = { method = "GET", path = "/api/v2/config/main" }
expect  = { status = 401, json = { error = "No authorization token." } }

[[proof]]
id      = "medusa.keeps-its-key"
service = "medusa"
title   = "Medusa hands its key to nobody presenting nothing"
fixture = "recordings/medusa/key-kept.json"
why     = """
A Medusa with no account on its own pages hands its API key to anybody who asks
for it. lemonfiber writes the account it minted into Medusa's settings before
Medusa first starts, so the pinned image, started from those settings, has to
refuse the key to a caller presenting nothing.
"""
request = { method = "GET", path = "/getkey/" }
expect  = { status = 200, json = { success = false } }

[[ask]]
service    = "medusa"
capability = "download.usenet"
native     = "sabnzbd"

[[ask]]
service    = "medusa"
capability = "download.torrent"
native     = "qbittorrent"

[[ask]]
service    = "medusa"
capability = "indexer.search"
native     = ["servarr", "nzbhydra2"]
