schema_version = 1

[plugin]
id          = "calibre-web-automated"
name        = "Calibre-Web-Automated"
version     = "1.0.0"
description = "Reading and organising your ebook library"
without_it  = "No ebook reader"
upstream    = "https://github.com/crocodilestick/Calibre-Web-Automated"
license     = "GPL-3.0-only"
forms       = ["library", "full"]

[[service]]
id          = "calibre-web-automated"
name        = "Calibre-Web-Automated"
image       = "crocodilestick/calibre-web-automated"
digest      = "sha256:577e846f104fd21453ef306eefb4a95dd95b3b9ddd2463a150944494284da0fd"
tag         = "V3.1.4"
port        = 8083
bind        = "lan"
health      = { kind = "http", path = "/", timeout_s = 90 }
criticality = "enhancing"
memory_mib  = 300
reaches     = "book metadata providers"
asks_for    = "Reads covers and descriptions for the ebooks in your library when you ask it to."
takes_data  = true
user_mode   = "puid-env"
replaces    = "calibre-web-automated"

[[service]]
id          = "calibre-web-automated-adapter"
name        = "Calibre-Web-Automated adapter"
image       = "ghcr.io/lemonfiber/calibre-web-automated-adapter"
digest      = "sha256:a275b1eb0b901cde0bcc5b621fe01f3820b5e076a6c3eaa1b25bdbacd7890a92"
tag         = "main-a6d98fc84850"
criticality = "enhancing"
reaches     = ""
asks_for    = "Nothing beyond this machine. It answers lemonfiber's owner.claim and media.serve contracts by calling Calibre-Web-Automated, beside it, as the administrator lemonfiber minted for it."
config_path = "/config"
listens     = 8080
speaks      = ["owner.claim@1", "media.serve@1"]
fronts      = "calibre-web-automated"
provides    = ["media.serve"]
media_types = ["books"]
upstream    = { username = { secret = "admin-username" }, password = { secret = "admin-password" } }

[[secret]]
id     = "admin-username"
of     = "calibre-web-automated"
minted = true
why    = "The name of the administrator Calibre-Web-Automated is claimed for, which the adapter in front of it signs in as"

[[secret]]
id     = "admin-password"
of     = "calibre-web-automated"
minted = "password"
why    = "The password of the administrator Calibre-Web-Automated is claimed for, which the adapter in front of it signs in with, in the shape Calibre-Web-Automated's password rules accept"

[[proof]]
id      = "calibre-web-automated.guarded"
service = "calibre-web-automated"
title   = "Calibre-Web-Automated shows its catalogue to nobody presenting nothing"
fixture = "recordings/calibre-web-automated/opds-guarded.json"
why     = """
A library server on the household network that answered this would be
publishing the household's books to every device that can reach it. Only the
adapter asks it, signed in as the administrator lemonfiber minted.
"""
request = { method = "GET", path = "/opds" }
expect  = { status = 401, body_starts_with = "Unauthorized Access" }

[[ask]]
service    = "calibre-web-automated"
capability = "proxy.front"

[[wiring]]
service  = "calibre-web-automated"
hostname = "books"
