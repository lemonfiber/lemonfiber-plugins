schema_version = 1

[plugin]
id          = "nzbhydra2"
name        = "NZBHydra2"
version     = "1.0.0"
description = "A search box across all your Usenet indexers at once"
without_it  = "Search one indexer at a time"
upstream    = "https://github.com/theotherp/nzbhydra2"
license     = "Apache-2.0"
forms       = ["search", "hunt", "tv", "movies", "music", "books", "auto", "full"]

[[service]]
id          = "nzbhydra2"
name        = "NZBHydra2"
image       = "lscr.io/linuxserver/nzbhydra2"
digest      = "sha256:3cdcea6fc97861bb30ef2551884f1c371e08a884c2f75230c7a3a2e14c5f0516"
tag         = "v8.9.0-ls104"
port        = 5076
bind        = "loopback"
listens     = 5076
health      = { kind = "http", path = "/internalapi/userinfos", timeout_s = 60 }
criticality = "enhancing"
memory_mib  = 400
reaches     = "the Usenet indexers you configured"
asks_for    = "Searches several indexers at once and merges what they answer, with the keys you gave it."
takes_data  = true
user_mode   = "puid-env"
native      = "nzbhydra2"
replaces    = "nzbhydra2"

[[service]]
id          = "nzbhydra2-adapter"
name        = "NZBHydra2 adapter"
image       = "ghcr.io/lemonfiber/nzbhydra2-adapter"
digest      = "sha256:3e03a4102a455a5f1ef44cf3985e2c1c97058753cdb347af8e45d50d140d31ca"
tag         = "main-95bbd33b687b"
criticality = "enhancing"
reaches     = ""
asks_for    = "Nothing beyond this machine. It answers lemonfiber's owner.claim and indexer.search contracts by calling NZBHydra2, beside it, as the administrator lemonfiber minted for it."
config_path = "/config"
listens     = 8080
speaks      = ["owner.claim@1", "indexer.search@1"]
fronts      = "nzbhydra2"
provides    = ["indexer.search"]
upstream    = { username = { secret = "admin-username" }, password = { secret = "admin-password" } }

[[secret]]
id     = "admin-username"
of     = "nzbhydra2"
minted = true
why    = "The name of the administrator NZBHydra2 is claimed for, which the adapter in front of it signs in as"

[[secret]]
id     = "admin-password"
of     = "nzbhydra2"
minted = true
why    = "The password of the administrator NZBHydra2 is claimed for, which the adapter in front of it signs in with"

[[proof]]
id      = "nzbhydra2.guarded"
service = "nzbhydra2"
title   = "A claimed NZBHydra2 shows its configuration to nobody presenting nothing"
fixture = "recordings/nzbhydra2/config-guarded.json"
why     = """
NZBHydra2's configuration holds every indexer's key and the administrator it was
claimed for. Once claimed, only the adapter reads it, signed in as that
administrator, so a NZBHydra2 that answered it to a caller presenting nothing
would be handing those keys to every device that can reach it.
"""
request = { method = "GET", path = "/internalapi/config" }
expect  = { status = 401, body_starts_with = "<!doctype html><html lang=\"en\"><head><title>HTTP Status 401" }
