schema_version = 1

[plugin]
id          = "unpackerr"
name        = "Unpackerr"
version     = "1.0.0"
description = "Extracts archived releases so they can be imported"
without_it  = "Some downloads never import"
upstream    = "https://github.com/Unpackerr/unpackerr"
license     = "MIT"
forms       = ["auto", "full"]

[[service]]
id          = "unpackerr"
name        = "Unpackerr"
image       = "ghcr.io/hotio/unpackerr"
digest      = "sha256:724c702e81727e3d90c42cf2b3d900674203906a6d135ba07416c9a3f9f67fbb"
tag         = "release-0.15.2"
listens     = 5656
health      = { kind = "container" }
criticality = "enhancing"
memory_mib  = 50
reaches     = ""
asks_for    = "Nothing. It watches the download directories and extracts archived releases where it finds them, entirely on this machine."
takes_data  = true
user_mode   = "puid-env"
replaces    = "unpackerr"

[service.env]
UMASK                    = { setting = "unpackerr:umask", default = "002" }
UN_WEBSERVER_METRICS     = "true"
UN_WEBSERVER_LISTEN_ADDR = "0.0.0.0:5656"

[[service]]
id            = "unpackerr-adapter"
name          = "Unpackerr adapter"
image         = "ghcr.io/lemonfiber/unpackerr-adapter"
digest        = "sha256:c6f5735f8f0937efe513216e43e21c0bba3f2a2b43e2bcae5731c0a04d4a0cea"
tag           = "main-612ed5f5f29b"
criticality   = "optional"
reaches       = ""
asks_for      = "Nothing beyond this machine. It answers lemonfiber's archive.extract contract by writing the curators lemonfiber hands it into the configuration Unpackerr, beside it, reads, and hears what Unpackerr extracts from the events it posts back."
config_path   = "/config"
listens       = 8080
speaks        = ["archive.extract@1"]
fronts        = "unpackerr"
provides      = ["archive.extract"]
shares_config = "/unpackerr"
posture       = "confined"

[[proof]]
id      = "unpackerr.metrics"
service = "unpackerr"
title   = "Unpackerr answers its metrics in Prometheus's text format"
request = { method = "GET", path = "/metrics" }
expect  = { status = 200, content_type = "text/plain; version=0.0.4", body_starts_with = "# HELP go_gc_duration_seconds" }
fixture = "recordings/unpackerr/metrics.json"
why     = """
Unpackerr answers nothing else over HTTP. Its metrics server, turned on by
its declaration, is the one place it says anything about its work, and the
exposition format is what says the answer is Unpackerr's and not an empty
port.
"""
