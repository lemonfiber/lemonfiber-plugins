schema_version = 1

[plugin]
id          = "bindery"
name        = "Bindery"
version     = "1.0.0"
description = "Watches for books and audiobooks and fetches them"
without_it  = "No book automation (Readarr is discontinued)"
upstream    = "https://github.com/vavallee/bindery"
license     = "MIT"
forms       = ["books", "auto", "full"]

[[service]]
id          = "bindery"
name        = "Bindery"
image       = "ghcr.io/vavallee/bindery"
digest      = "sha256:27109c963f91a27f08d8825b406b2b5a5c59aed080bd9f3a7e585e235673d489"
tag         = "v1.43.1"
port        = 8787
bind        = "loopback"
listens     = 8787
health      = { kind = "http", path = "/", timeout_s = 90 }
criticality = "core"
memory_mib  = 150
reaches     = "book and audiobook metadata providers"
asks_for    = "Reads author, title and cover information for the books it watches for."
takes_data  = true
user_mode   = "uid"
media_types = ["books"]
replaces    = "bindery"

[service.env]
BINDERY_LIBRARY_DIR   = "/data/media/books"
BINDERY_AUDIOBOOK_DIR = "/data/media/audiobooks"
BINDERY_DOWNLOAD_DIR  = "/data/downloads"
BINDERY_API_KEY       = { secret = "api-key" }

[[service]]
id          = "bindery-adapter"
name        = "Bindery adapter"
image       = "ghcr.io/lemonfiber/bindery-adapter"
digest      = "sha256:8fae4b9248384eda8d97edbc4f8274afeaf7279dfa1dc74be683c9bc6da191f4"
tag         = "main-ec0e337888aa"
criticality = "core"
reaches     = ""
asks_for    = "Nothing beyond this machine. It answers lemonfiber's owner.claim, indexer.pull and library.curate contracts by calling Bindery, beside it, with the key and the administrator lemonfiber minted for it."
config_path = "/config"
listens     = 8080
speaks      = ["owner.claim@1", "indexer.pull@1", "library.curate@1"]
fronts      = "bindery"
provides    = ["library.curate"]
upstream    = { api_key = { secret = "api-key" }, username = { secret = "admin-username" }, password = { secret = "admin-password" } }

[[secret]]
id     = "api-key"
of     = "bindery"
minted = true
why    = "The key lemonfiber mints and Bindery adopts, which the adapter in front of it presents"

[[secret]]
id     = "admin-username"
of     = "bindery"
minted = true
why    = "The name of the first account Bindery is claimed for, which the adapter signs in as"

[[secret]]
id     = "admin-password"
of     = "bindery"
minted = true
why    = "The password of the first account Bindery is claimed for, which the adapter signs in with"

[[proof]]
id      = "bindery.guarded"
service = "bindery"
title   = "Bindery shows what it is watching for to nobody presenting nothing"
fixture = "recordings/bindery/wanted-guarded.json"
why     = """
A curator holds every key the stack gave it and can be made to download
anything. Only the adapter asks it, with the key lemonfiber minted, so a Bindery
that answered its wanted list to a caller presenting nothing would be answering
every device that can reach it.
"""
request = { method = "GET", path = "/api/v1/wanted/missing" }
expect  = { status = 401, json = { error = "unauthorized" } }

[[ask]]
service    = "bindery"
capability = "download.usenet"

[[ask]]
service    = "bindery"
capability = "download.torrent"

[[ask]]
service    = "bindery"
capability = "indexer.search"
