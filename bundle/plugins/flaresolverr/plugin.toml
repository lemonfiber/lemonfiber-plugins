schema_version = 1

[plugin]
id          = "flaresolverr"
name        = "FlareSolverr"
version     = "1.0.0"
description = "Gets past bot-protection on some indexers"
without_it  = "Those indexers return nothing"
upstream    = "https://github.com/FlareSolverr/FlareSolverr"
license     = "MIT"
forms       = ["search", "hunt", "tv", "movies", "music", "books", "auto", "full"]

[[service]]
id          = "flaresolverr"
name        = "FlareSolverr"
image       = "ghcr.io/flaresolverr/flaresolverr"
digest      = "sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767"
tag         = "v3.5.2"
port        = 8191
bind        = "loopback"
health      = { kind = "tcp", timeout_s = 60 }
criticality = "enhancing"
memory_mib  = 300
reaches     = "the indexer sites that challenge it"
asks_for    = "Fetches a page through a headless browser when an indexer sits behind bot protection, which means it visits that indexer directly."
replaces    = "flaresolverr"
network     = { fenced = true }

[service.env]
LOG_LEVEL = { setting = "flaresolverr:log-level", default = "info" }

[[service]]
id          = "flaresolverr-adapter"
name        = "FlareSolverr adapter"
image       = "ghcr.io/lemonfiber/flaresolverr-adapter"
digest      = "sha256:44209dede06190a4a8933d8cb64d5ae28a7bcfdc5ead8b200e4f88930feeb2f1"
tag         = "main-440ebf321817"
criticality = "enhancing"
reaches     = ""
asks_for    = "Nothing beyond this machine but the names it looks up. It answers lemonfiber's indexer.proxy contract by handing FlareSolverr, beside it, each address that passes its screen."
config_path = "/config"
listens     = 8080
speaks      = ["indexer.proxy@1"]
fronts      = "flaresolverr"
provides    = ["indexer.proxy"]
posture     = "confined"

[[proof]]
id      = "flaresolverr.identifies"
service = "flaresolverr"
title   = "FlareSolverr answers that it is ready, and names its version"
request = { method = "GET", path = "/" }
expect  = { status = 200, json = { msg = "FlareSolverr is ready!" }, json_types = { version = "str" } }
fixture = "recordings/flaresolverr/indexer-proxy-identifies.json"
why     = """
FlareSolverr's root is the one place it says it is FlareSolverr and which
version answers, and the adapter in front of it asks nothing else of it before
handing it a page to fetch.
"""
