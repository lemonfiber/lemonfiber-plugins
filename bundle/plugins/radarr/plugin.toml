schema_version = 1

[plugin]
id          = "radarr"
name        = "Radarr"
version     = "1.0.0"
description = "Watches for films and fetches them"
without_it  = "Find and download films yourself"
upstream    = "https://github.com/Radarr/Radarr"
license     = "GPL-3.0-only"
forms       = ["movies", "auto", "full"]

[[service]]
id          = "radarr"
name        = "Radarr"
image       = "lscr.io/linuxserver/radarr"
digest      = "sha256:c984533510abe0219a70e80d15bd0d212b7df21baa0913759c4ce6cc9092240b"
tag         = "5.28.0.10274-ls286"
port        = 7878
bind        = "loopback"
listens     = 7878
health      = { kind = "http", path = "/ping", timeout_s = 90 }
criticality = "core"
memory_mib  = 300
reaches     = "film metadata providers"
asks_for    = "Reads titles, release dates and artwork for the films in your library and the ones you add."
takes_data  = true
user_mode   = "puid-env"
media_types = ["movies"]
native      = "servarr"
replaces    = "radarr"

[service.env]
RADARR__AUTH__APIKEY = { secret = "upstream-key" }

[[service]]
id          = "radarr-adapter"
name        = "Radarr adapter"
image       = "ghcr.io/lemonfiber/radarr-adapter"
digest      = "sha256:b73a12e2f19ef9d2cf8078f836fe1c30e4b10d46e6b171d0418b3298094b3e12"
tag         = "main-588abf26c392"
criticality = "core"
reaches     = ""
asks_for    = "Nothing beyond this machine. It answers lemonfiber's library.curate contract by calling Radarr, beside it, with the key lemonfiber minted for it."
config_path = "/config"
listens     = 8080
speaks      = ["library.curate@1"]
fronts      = "radarr"
provides    = ["library.curate"]
upstream    = { api_key = { secret = "upstream-key" } }

[[secret]]
id     = "upstream-key"
of     = "radarr"
minted = true
why    = "The key Radarr answers its API to, which the adapter in front of it presents"

[[proof]]
id      = "radarr.answers"
service = "radarr"
title   = "Radarr says it answers to anybody"
fixture = "recordings/radarr/ping-answers.json"
why     = """
The adapter's readiness is this answer, which it asks without a key, so the
pinned image has to give it to a caller presenting nothing.
"""
request = { method = "GET", path = "/ping" }
expect  = { status = 200, json = { status = "OK" } }

[[proof]]
id      = "radarr.guarded"
service = "radarr"
title   = "Radarr shows what it wants to nobody presenting nothing"
fixture = "recordings/radarr/wanted-guarded.json"
why     = """
What Radarr wants names what the household watches. Only the adapter asks, with
the key lemonfiber minted, so a Radarr that answered it to a caller presenting
nothing would be telling every device that can reach it.
"""
request = { method = "GET", path = "/api/v3/wanted/missing" }
expect  = { status = 401 }

[[ask]]
service    = "radarr"
capability = "download.usenet"

[[ask]]
service    = "radarr"
capability = "download.torrent"

[[ask]]
service    = "radarr"
capability = "dashboard.show"
