schema_version = 1

[plugin]
id          = "navidrome"
name        = "Navidrome"
version     = "1.0.0"
description = "Plays your music library in a browser, on a phone, and in any Subsonic client"
without_it  = "Music arrives and only the thing that fetched it ever looks at it"
upstream    = "https://github.com/navidrome/navidrome"
license     = "GPL-3.0-only"
forms       = ["library", "full"]

[[service]]
id          = "navidrome"
name        = "Navidrome"
image       = "ghcr.io/navidrome/navidrome"
digest      = "sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52"
tag         = "0.64.2"
port        = 4533
bind        = "lan"
health      = { kind = "http", path = "/ping", timeout_s = 90 }
criticality = "enhancing"
memory_mib  = 100
reaches     = "music metadata providers, and the background collection its sign-in page draws from"
asks_for    = "Reads artist images, biographies and similar-artist lists for the music in your library — Deezer and ListenBrainz, neither of which needs an account of yours. Its anonymous usage report is the one thing it would send about this machine, and the compose entry turns that off rather than leaving it on."
provides    = ["media.serve"]
takes_data  = true
user_mode   = "uid"
replaces    = "navidrome"

[service.env]
ND_MUSICFOLDER             = "/data/media/music"
ND_DATAFOLDER              = "/config"
ND_ENABLEINSIGHTSCOLLECTOR = "false"

[[claim]]
capability = "media.serve"

[[claim.probe]]
id      = "guarded"
request = { method = "GET", path = "/api/album" }
expect  = { status = 401 }
fixture = "recordings/navidrome/media-serve-guarded.json"

[[claim.probe]]
id      = "catalogue"
request = { method = "GET", path = "/api/album" }
expect  = { status = 200, json_array_min = 0 }
fixture = "recordings/navidrome/media-serve-catalogue.json"
