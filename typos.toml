# Canonical typos configuration for every lemonfiber repo.
#
# Unlike the markdownlint config, this one is a floor rather than a copy: a repo
# may add words and patterns its own tree needs, but every entry below must be
# present with the same value. The `shared-files` job in the hygiene gate checks
# that (GOV-R12, Q-R56).
#
# A repo starting from scratch copies this file to its root as `typos.toml` and
# adds to it.

[default]
# Ignore hotkey mockup notation like [e]rror, [s]ervice in TUI examples.
# A commit hash is hexadecimal, and its letters are not words.
extend-ignore-re = ["\\[[a-z]\\][a-zA-Z]+", "\\b[0-9a-f]*[0-9][0-9a-f]*\\b"]

[default.extend-words]
ratatui = "ratatui"
Ratatui = "Ratatui"
lemonfiber = "lemonfiber"
Servarr = "Servarr"
# Navidrome's environment prefix. Every one of its settings is ND_SOMETHING, and
# the checker reads the prefix on its own as a misspelling of "AND".
ND = "ND"
